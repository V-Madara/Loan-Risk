<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Loan risk check: animated risk gauge" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1633"/>
      <stop offset="1" stop-color="#070e20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3c5eff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3c5eff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <circle cx="700" cy="150" r="170" fill="url(#glow)">
    <animate attributeName="r" values="150;185;150" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#e9effb">
    <text x="48" y="104" font-size="44" font-weight="800">Loan Risk Check</text>
    <text x="48" y="144" font-size="19" fill="#a5b4d3">Machine learning default prediction</text>
    <text x="48" y="172" font-size="19" fill="#a5b4d3">FastAPI + XGBoost, with a live risk gauge</text>
    <g>
      <rect x="48" y="196" width="150" height="34" rx="17" fill="#dce6ff"/>
      <text x="123" y="219" font-size="16" font-weight="700" fill="#0a1330" text-anchor="middle">Try the live app</text>
    </g>
  </g>

  <!-- gauge -->
  <g transform="translate(700 175)">
    <path d="M -120 0 A 120 120 0 0 1 120 0" fill="none" stroke="#22345d" stroke-width="16"/>
    <path d="M -120 0 A 120 120 0 0 1 120 0" fill="none" stroke="#2fd5a1" stroke-width="16" pathLength="100" stroke-dasharray="45 100"/>
    <path d="M -120 0 A 120 120 0 0 1 120 0" fill="none" stroke="#ff5c70" stroke-width="16" pathLength="100" stroke-dasharray="55 100" stroke-dashoffset="-45"/>

    <!-- needle sweeps and settles, then repeats -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-90;90;-30;20;-10;38;-90"
        keyTimes="0;0.22;0.4;0.55;0.68;0.82;1"
        dur="9s" repeatCount="indefinite"
        calcMode="spline"
        keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
      <line x1="0" y1="0" x2="0" y2="-98" stroke="#e9effb" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle r="10" fill="#e9effb"/>
    <circle r="3.5" fill="#0a1330"/>
  </g>
</svg>
